# ==============================================================
# Jekyll Site Configuration for Junteng Liu
# ==============================================================

# Site Settings
title: Junteng Liu
tagline: Junteng Liu
description: Personal homepage of Junteng Liu, PhD candidate at HKUST NLP Group.
url: "https://ChampionShinobi.github.io"
baseurl: "/LJT-Homepage"
repository: ChampionShinobi/LJT-Homepage

# Build settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
timezone: Asia/Hong_Kong

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# ==============================================================
# Author / Profile
# ==============================================================
author:
  name: Junteng Liu
  avatar: /images/profile.png
  email: jliugi@connect.ust.hk
  github: Vicent0205
  googlescholar: "https://scholar.google.com/citations?hl=en&amp;user=tbK9jl4AAAAJ&amp;view_op=list_works&amp;sortby=pubdate"
  twitter: junteng88716710
  orcid:
  linkedin:
  address:
  - Hong Kong University of Science and Technology
  - NLP Group
  - Hong Kong

# ==============================================================
# Navigation
# ==============================================================
navigation:
  - title: About
    url: /
  - title: Publications
    url: /publications/

# ==============================================================
# Collections
# ==============================================================
collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# ==============================================================
# Styling
# ==============================================================
header:
  image: false

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - docker-compose.yaml
  - Dockerfile
